<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Área de Formação - Gestor TCC</title>
  <link rel="stylesheet" href="/css/templatemo-glass-admin-style.css">
</head>
<body>
  <div class="background"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="dashboard">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">HB</div>
        <span class="logo-text">Gestor TCC</span>
      </div>
      <ul class="nav-menu"></ul>
      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar">HB</div>
          <div class="user-info">
            <div class="user-name">H & B</div>
            <div class="user-role">Administrador</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <nav class="navbar">
        <div class="page-header">
          <h1 class="page-title">Editar Área</h1>
          <div class="page-breadcrumb"><a href="/AreadeFormacao">Áreas de Formação</a><span>/</span><span>Editar</span></div>
        </div>
        <div class="navbar-right">
          <button class="nav-btn" id="theme-toggle" title="Alternar tema">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/>
                <path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/>
                <path d="M2 12h2"/><path d="M20 12h2"/>
                <path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </nav>

      <section class="glass-card operational-panel" style="max-width:760px;">
        <div class="card-header">
          <div>
            <h2 class="card-title">Editar Área de Formação</h2>
            <p class="card-subtitle">Atualize os dados da área</p>
          </div>
        </div>

        <form class="operational-form" data-area-form>
          <div class="form-group">
            <label class="form-label">Nome</label>
            <input class="form-input" name="nome" type="text" placeholder="Nome da área" required>
          </div>
          <div class="form-group">
            <label class="form-label">Descrição</label>
            <input class="form-input" name="descricao" type="text" placeholder="Descrição da área">
          </div>
          <div class="operational-actions">
            <button class="btn btn-primary" type="submit">Guardar alterações</button>
            <a class="btn btn-secondary" data-show-link href="/AreadeFormacao">Cancelar</a>
          </div>
          <p class="operational-message" data-message></p>
        </form>
      </section>
    </main>
  </div>

  <button class="mobile-menu-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <script src="/js/templatemo-glass-admin-script.js"></script>
  <script src="/js/Area_de_Formacao/edit.js"></script>
</body>
</html>
