<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de acesso | Gestor TCC</title>
    <meta name="description" content="Resultado da recuperação de acesso ao Gestor TCC">
    <link rel="stylesheet" href="/css/templatemo-glass-admin-style.css">
</head>
<body>
    <div class="background"></div>
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo" data-result-icon>OK</div>
                    <p class="login-kicker">Recuperação de acesso</p>
                    <h1 class="login-title" data-result-title>A pedido foi recebido</h1>
                    <p class="login-subtitle" data-result-message>Verifique o seu telefone para consultar a palavra-passe temporária.</p>
                </div>
                <div class="login-form">
                    <a class="btn btn-primary" href="/auth/sign-in">Voltar ao início de sessão</a>
                    <a class="auth-support-link" href="/auth/forgot-password">Tentar novamente</a>
                </div>
            </div>
        </div>
        <footer class="site-footer"><p>Gestor TCC · Plataforma académica</p></footer>
    </div>
    <script src="/js/auth/forgot-password-result.js"></script>
</body>
</html>
