<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar acesso | Gestor TCC</title>
    <meta name="description" content="Recupere o acesso ao Gestor TCC">
    <link rel="stylesheet" href="/css/templatemo-glass-admin-style.css">
</head>
<body>
    <div class="background"></div>
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">TCC</div>
                    <p class="login-kicker">Recuperação de acesso</p>
                    <h1 class="login-title">Esqueceu-se da palavra-passe?</h1>
                    <p class="login-subtitle">Enviaremos uma palavra-passe temporária para o seu telefone.</p>
                </div>
                <form action="/auth/forgot-password" method="POST" class="login-form">
                    <div class="form-group">
                        <label class="form-label" for="email">E-mail institucional</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="nome@instituicao.pt" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar palavra-passe temporária</button>
                </form>
                <p class="login-footer"><a href="/auth/sign-in">Voltar ao início de sessão</a></p>
            </div>
        </div>
        <footer class="site-footer"><p>Gestor TCC · Plataforma académica</p></footer>
    </div>
</body>
</html>
