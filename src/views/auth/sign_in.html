<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Gestor TCC</title>
    <meta name="description" content="Acesso ao Gestor TCC">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/templatemo-glass-admin-style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="background"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-page">
        <!-- Theme Toggle -->
        <button class="theme-toggle-float" id="theme-toggle" title="Toggle Light/Dark Mode">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/>
                <path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/>
                <path d="M2 12h2"/><path d="M20 12h2"/>
                <path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>

        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-logo">TCC</div>
                    <p class="login-kicker">Gestão académica</p>
                    <h1 class="login-title">Bem-vindo ao Gestor TCC</h1>
                    <p class="login-subtitle">Entre para acompanhar trabalhos, orientações e defesas.</p>
                </div>

                <form class="login-form" id="loginForm">
                    <p class="form-message" data-login-message role="alert" aria-live="polite"></p>

                    <div class="form-group">
                        <label class="form-label" for="email">E-mail</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="E-mail" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Palavra-passe</label>
                        <div class="password-field">
                            <input type="password" id="password" name="password" class="form-input" placeholder="Palavra-passe" required>
                            <button class="password-toggle" type="button" data-toggle-password aria-label="Mostrar palavra-passe">Mostrar</button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Entrar
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </button>
                </form>

                <a class="auth-support-link" href="/auth/forgot-password">Esqueci-me da palavra-passe</a>

                <div class="divider">
                    <span>ou entre com</span>
                </div>

                <p class="login-footer">
                    Ainda não está cadastrado? <a href="/auth/user-type">Criar Conta</a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="site-footer">
            <p>Gestor TCC · Plataforma académica</p>
        </footer>
    </div>

    <script src="/js/templatemo-glass-admin-script.js"></script>
    <script src="/js/auth/login.js"></script>
</body>
</html>
