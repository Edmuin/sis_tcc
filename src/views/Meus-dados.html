<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Dados - Gestor TCC</title>
  <meta name="description" content="Sistema de Gerenciamento de TCC">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/templatemo-glass-admin-style.css">
</head>
<body>
  <div class="background"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="dashboard">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">HB</div>
        <span class="logo-text">Gestor TCC</span>
      </div>

      <ul class="nav-menu"></ul>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar">HB</div>
          <div class="user-info">
            <div class="user-name">H & B</div>
            <div class="user-role">Administrador</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <nav class="navbar">
        <div class="page-header">
          <h1 class="page-title">Meus Dados</h1>
          <div class="page-breadcrumb">
            <a href="/PainelPrincipal">Painel</a>
            <span>/</span>
            <span>Meus Dados</span>
          </div>
        </div>
        <div class="navbar-right">
          <button class="nav-btn" id="theme-toggle" title="Alternar tema">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2"/><path d="M12 20v2"/>
              <path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/>
              <path d="M2 12h2"/><path d="M20 12h2"/>
              <path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </nav>

      <section class="glass-card operational-panel" style="max-width: 960px;">
        <div class="profile-header">
          <div class="profile-avatar-large">HB</div>
          <div class="profile-info">
            <h2>Utilizador</h2>
            <p>admin@gestortcc.local - Administrador</p>
          </div>
        </div>

        <form class="operational-form">
          <div class="settings-section">
            <h3 class="settings-section-title">Informações Pessoais</h3>
            <div class="form-grid">
              <div class="form-group-settings">
                <label>Nome completo</label>
                <input type="text" value="H & B">
              </div>
              <div class="form-group-settings">
                <label>E-mail</label>
                <input type="email" value="admin@gestortcc.local">
              </div>
              <div class="form-group-settings">
                <label>Telefone</label>
                <input type="tel" value="+244 900 000 000">
              </div>
              <div class="form-group-settings">
                <label>Perfil</label>
                <input type="text" value="Administrador">
              </div>
              <div class="form-group-settings full-width">
                <label>Resumo</label>
                <textarea>Utilizador do sistema académico para acompanhamento de TCCs.</textarea>
              </div>
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-section-title">Dados Académicos</h3>
            <div class="form-grid">
              <div class="form-group-settings">
                <label>Curso</label>
                <input type="text" value="Por definir">
              </div>
              <div class="form-group-settings">
                <label>Orientador</label>
                <input type="text" value="Por definir">
              </div>
              <div class="form-group-settings">
                <label>Número de processo</label>
                <input type="text" value="Por definir">
              </div>
              <div class="form-group-settings">
                <label>Ano lectivo</label>
                <input type="text" value="2026">
              </div>
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-section-title">Segurança</h3>
            <div class="form-grid">
              <div class="form-group-settings">
                <label>Senha atual</label>
                <input type="password" placeholder="Informe a senha atual">
              </div>
              <div class="form-group-settings">
                <label>Nova senha</label>
                <input type="password" placeholder="Informe a nova senha">
              </div>
            </div>
          </div>

          <div class="btn-group">
            <button class="btn btn-primary" type="button" style="width: auto;">Guardar Alterações</button>
            <a class="btn btn-secondary" href="/PainelPrincipal" style="width: auto;">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
  </div>

  <button class="mobile-menu-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <footer class="site-footer">
    <p>Copyright © 2026 Gestor TCC. Desenvolvido por <a href="/PainelPrincipal" rel="nofollow">H&B</a></p>
  </footer>

  <script src="/js/templatemo-glass-admin-script.js"></script>
</body>
</html>
